<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infrastructure Services</title>
    <script>
      // GitHub Pages SPA redirect - fetch index.html and replace body
      // This preserves the URL so BrowserRouter can handle routing
      fetch('/index.html')
        .then(response => response.text())
        .then(html => {
          document.open();
          document.write(html);
          document.close();
        })
        .catch(() => {
          // Fallback: redirect to root
          window.location.href = '/';
        });
    </script>
  </head>
  <body>
    <p>Loading...</p>
  </body>
</html>
